<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">EPROLISA GROUP LLC</title>
  <desc id="desc">Corporate logo for EPROLISA GROUP LLC</desc>

  <!-- Stylized geometric E: three forward-leaning parallelogram bars -->
  <g fill="#000000">
    <polygon points="198,24 410,24 434,78 222,78"/>
    <polygon points="174,96 450,96 474,150 198,150"/>
    <polygon points="150,168 490,168 514,222 174,222"/>
  </g>

  <!-- Primary wordmark -->
  <text
    x="320"
    y="304"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="74"
    font-weight="700"
    letter-spacing="12"
    fill="#000000"
  >EPROLISA</text>

  <!-- Secondary line with flanking rules -->
  <line x1="118" y1="352" x2="228" y2="352" stroke="#000000" stroke-width="2"/>
  <text
    x="320"
    y="360"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="26"
    font-weight="600"
    letter-spacing="8"
    fill="#000000"
  >GROUP LLC</text>
  <line x1="412" y1="352" x2="522" y2="352" stroke="#000000" stroke-width="2"/>
</svg>
